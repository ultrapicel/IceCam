name: Build IceCam v4

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Xposed API stub if missing
        run: |
          if [ ! -f app/libs/xposed-api-stub.jar ]; then
            mkdir -p xposed_stub_classes
            javac -source 8 -target 8 -d xposed_stub_classes $(find xposed_stub_src -name '*.java')
            jar cf app/libs/xposed-api-stub.jar -C xposed_stub_classes .
          fi

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Build root module ZIP
        run: |
          cd module
          zip -r ../IceCam-root-module-v0.4.0-dev.zip ./*
          cd ..

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/IceCam-app-v0.4.0-dev.apk
          cp IceCam-root-module-v0.4.0-dev.zip out/
          zip -r out/IceCam-source-snapshot-v0.4.0-dev.zip . -x '.git/*' 'out/*'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IceCam-v4-dev
          path: out/*
