name: Build IceCam v3.1
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Build root module zip
        run: |
          mkdir -p out
          cd module
          zip -r ../out/IceCam-root-module-v0.3.1-dev.zip .
          cd ..
          cp app/build/outputs/apk/debug/app-debug.apk out/IceCam-app-v0.3.1-dev.apk
          zip -r out/IceCam-source-snapshot.zip . -x './.git/*' './out/*'
      - uses: actions/upload-artifact@v4
        with:
          name: IceCam-v3.1-dev
          path: out/*
