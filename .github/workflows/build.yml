name: Build IceCam

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ICECAM_VERSION: v9.6.1
      GRADLE_VERSION: 8.7
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle --version

      - name: Validate repository structure
        shell: bash
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/xposed_init
          test -f app/src/main/java/com/icecam/dev/MainActivity.java
          test -f app/src/main/java/com/icecam/dev/hook/IceCamHook.java
          test -f app/src/main/java/com/icecam/dev/IceCamStateProvider.java
          test -f app/libs/xposed-api-stub.jar
          test -f module/module.prop
          test -f module/common/bin/icecamctl
          test -f module/META-INF/com/google/android/update-binary
          test -f module/META-INF/com/google/android/updater-script
          chmod +x module/common/bin/icecamctl module/*.sh module/META-INF/com/google/android/update-binary || true

      - name: Build APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Build root module zip
        shell: bash
        run: |
          mkdir -p out
          chmod +x module/common/bin/icecamctl module/*.sh module/META-INF/com/google/android/update-binary || true
          (cd module && zip -r9 ../out/IceCam-root-module-${ICECAM_VERSION}.zip .)

      - name: Copy APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/IceCam-app-${ICECAM_VERSION}.apk

      - name: Build source snapshot
        shell: bash
        run: |
          mkdir -p out
          zip -r9 out/IceCam-source-snapshot-${ICECAM_VERSION}.zip \
            settings.gradle build.gradle README.md app module xposed_stub_src .github \
            -x '**/.gradle/**' '**/build/**' '**/.git/**'

      - name: Build info
        shell: bash
        run: |
          {
            echo "IceCam ${ICECAM_VERSION}"
            date -u
            java -version 2>&1
            gradle --version
            echo "APK:"; ls -lh out/*.apk || true
            echo "Root module:"; ls -lh out/*.zip || true
          } > out/build-info.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IceCam-${{ env.ICECAM_VERSION }}-artifacts
          path: out/*
