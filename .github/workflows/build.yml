name: Build IceCam v3
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build root module zip
        run: |
          cd module
          zip -r ../IceCam-root-module-v0.3.0-dev.zip .
      - name: Package source snapshot
        run: zip -r IceCam-source-snapshot-v0.3.0-dev.zip . -x '.git/*' 'app/build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: IceCam-v3-dev
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            IceCam-root-module-v0.3.0-dev.zip
            IceCam-source-snapshot-v0.3.0-dev.zip
