name: Build IceCam

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build local Xposed stub jar
        run: |
          rm -rf /tmp/icecam_xposed_stub
          mkdir -p /tmp/icecam_xposed_stub/classes app/libs
          find xposed_stub_src -name '*.java' > /tmp/icecam_xposed_stub/sources.txt
          javac -source 8 -target 8 -d /tmp/icecam_xposed_stub/classes @/tmp/icecam_xposed_stub/sources.txt
          jar cf app/libs/xposed-api-stub.jar -C /tmp/icecam_xposed_stub/classes .
          ls -l app/libs/xposed-api-stub.jar

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build root module ZIP
        run: |
          mkdir -p build/artifacts
          cd module
          zip -r ../build/artifacts/IceCam-root-module-v9.3.zip .
          cd ..
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/IceCam-app-v9.3.apk

      - name: Build source snapshot
        run: |
          mkdir -p build/artifacts
          zip -r build/artifacts/IceCam-source-snapshot-v9.3.zip \
            app module xposed_stub_src .github settings.gradle build.gradle README.md \
            -x '*/build/*' -x '*/.gradle/*' -x '*.git*'

      - name: Build info
        run: |
          {
            echo "IceCam v9.3 surface ownership mapping"
            echo "date=$(date -u '+%F %T UTC')"
            echo "commit=${GITHUB_SHA:-manual}"
            echo "apk=IceCam-app-v9.3.apk"
            echo "module=IceCam-root-module-v9.3.zip"
            echo "source=IceCam-source-snapshot-v9.3.zip"
          } > build/artifacts/build-info-v9.3.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IceCam-v9.3-artifacts
          path: build/artifacts/*
