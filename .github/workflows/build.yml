name: Build IceCam v3.1.1
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        run: |
          set -e
          GRADLE_VERSION=8.7
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Locate project
        run: |
          set -e
          PROJECT_DIR="$(dirname "$(find "$GITHUB_WORKSPACE" -maxdepth 4 -name settings.gradle | head -n 1)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project dir: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Build root module zip
        run: |
          set -e
          cd "$PROJECT_DIR"
          mkdir -p out
          cd module
          zip -r ../out/IceCam-root-module-v0.3.1-dev.zip .
          cd ..
          cp app/build/outputs/apk/debug/app-debug.apk out/IceCam-app-v0.3.1-dev.apk
          zip -r out/IceCam-source-snapshot.zip . -x './.git/*' './out/*'
      - uses: actions/upload-artifact@v4
        with:
          name: IceCam-v3.1.1-dev
          path: ${{ env.PROJECT_DIR }}/out/*
