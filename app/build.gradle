plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' // if using Kotlin
}

android {
    namespace 'dev.icecam.app'
    compileSdk 35

    defaultConfig {
        applicationId "dev.icecam.app"
        minSdk 26
        targetSdk 35
        versionCode 250
        versionName "2.5.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        prefab true          // Required for ShadowHook
        viewBinding true
    }

    externalNativeBuild {
        cmake {
            path file("../../icecam_native_v2/CMakeLists.txt")
            version "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // ShadowHook v2.0.0 via Prefab
    implementation 'com.bytedance.android:shadowhook:2.0.0'

    // FileProvider for sharing logs
    implementation 'androidx.core:core:1.13.1'
}