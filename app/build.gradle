plugins { id 'com.android.application' }

android {
    namespace 'com.icecam.dev'
    compileSdk 35
    defaultConfig {
        applicationId 'com.icecam.dev'
        minSdk 26
        targetSdk 35
        versionCode 313
        versionName '0.3.1.3-dev'
    }
}

// Important: no Maven Xposed dependency here. GitHub Actions must build offline from local stub.
dependencies {
    compileOnly files('libs/xposed-api-stub.jar')
}
